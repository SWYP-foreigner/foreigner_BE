spring:
  flyway:
    enabled: true
    baseline-on-migrate: true

  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://db:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      leak-detection-threshold: 20000

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  thymeleaf:
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html
    check-template-location: true
  mail:
    host: ${GOOGLE_MAIL_HOST}
    port: 587
    username: ${GOOGLE_EMAIL}
    password: ${GOOGLE_EMAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true     # ★ 587 필수
      mail.smtp.starttls.required: true
      mail.smtp.ssl.enable: false
      mail.smtp.ssl.trust: smtp.gmail.com
      mail.smtp.ssl.protocols: TLSv1.2
      mail.debug: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.quitwait: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      key:
        prefix:
          refreshToken: "refreshToken:"
          blacklist: "blacklist:"
          accessToken: "access_token"
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 10080
  refresh-expiration: 10080


cloud:
  openfeign:
    client:
      config:
        default:
          connectTimeout: ${FEIGN_CONNECT_TIMEOUT}
          readTimeout: ${FEIGN_READ_TIMEOUT}
          loggerLevel: ${FEIGN_LOGGER_LEVEL}



oauth:
  google:
    android:
      client-id: ${ANDROID_CLIENT_ID}
      redirect-uri: ${ANDROID_REDIRECT_URI}
    ios:
      client-id: ${IOS_CLIENT_ID}
      redirect-uri: ${IOS_REDIRECT_URI}
    web:
      client-id: ${WEB_CLIENT_ID}
      client-secret: ${WEB_CLIENT_SECRET}
      redirect-uri: ${WEB_REDIRECT_URI}

  apple:
    issuer: https://appleid.apple.com
    team-id: ${APPLE_TEAM_ID}
    app-bundle-id: ${APPLE_APP_BUNDLE_ID}
    key-id: ${APPLE_KEY_ID}
    client-id: ${APPLE_CLIENT_ID}
    redirect-uri: ${APPLE_REDIRECT_URI}
    private-key-pem: ${APPLE_PRIVATE_KEY_PEM}

ncp:
  s3:
    access-key: ${NCP_ACCESS_KEY}
    secret-key: ${NCP_SECRET_KEY}
    region: kr-standard
    endpoint: https://kr.object.ncloudstorage.com
    bucket: ${NCP_BUCKET_NAME}
  clova:
    apiUrl: https://clovastudio.stream.ntruss.com/testapp/v1/chat-completions/HCX-003
    apiKey: ${CLOVA_STUDIO_API_KEY}

swagger:
  server-url: ${SERVER_URL}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

google:
  cloud:
    project:
      id: ${GCP_PROJECT_ID}
    perspective:
      api-key: ${GCP_PERSPECTIVE_API_KEY}
  maps:
    api:
      key: ${GCP_MAP_API_KEY}

logging:
  level:
    root: INFO

    # 프레임워크 소음 차단
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.web: INFO
    org.springframework.http.converter: INFO

    # WebSocket/메시징은 운영에서 WARN 이상
    org.springframework.web.socket: WARN
    org.springframework.messaging: WARN
    org.apache.tomcat.websocket: WARN

    # 애플리케이션 커스텀 로거(운영 기본 INFO)
    core: INFO
    core.global.config.core.global.security.JwtTokenFilter: INFO
    core.global.search: INFO

# 운영에서는 에러 본문 노출 금지
server.error.include-message: always
server.error.include-binding-errors: always

app:
  mail:
    from: ${NAVER_HOST}
    brand: ${APP_NAME}
    code-ttl-minutes: 3
  password:
    reset:
      ttl-minutes: 15
      session-ttl-minutes: 5

  api:
    base-url: ${BASE_URL}

cdn:
  base-url: ${NCP_CDN_URL}

firebase:
  credentials:
    json-string: ${FIREBASE_CREDENTIALS_JSON}

management:
  health:
    mail:
      enabled: true
  endpoints:
    web:
      exposure:
        include: prometheus, health, metrics, info, loggers
  endpoint:
    prometheus:
      enabled: true
    health:
      cache:
        time-to-live: 10s
      show-details: always

  metrics:
    tags:
      application: my-service
      app: social-chat
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

  prometheus:
    metrics:
      export:
        enabled: true

resilience4j:
  retry:
    instances:
      mailSend:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - jakarta.mail.MessagingException

sightengine:
  api-user: ${SIGHTENGINE_API_USER}
  api-secret: ${SIGHTENGINE_API_SECRET}

smoke:
  enabled: true
  token: ${SMOKE_TOKEN:}
  base-url: ${SMOKE_BASE_URL:http://localhost:8080}
  admin:
    email: ${SMOKE_ADMIN_EMAIL}
    password: ${SMOKE_ADMIN_PW}
    login-path: ${SMOKE_ADMIN_LOGIN_URL}
  gate:
    - name: health
      type: "HEALTH"
      method: GET
      path: /actuator/health
      expected-status: 200

  full:
    # --- [2] 정적/기본 정보 조회 (네트워크 및 캐시 확인) ---
    - name: "App-Version-Check"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/app/version?os=ANDROID&version=1.0.0"
      expectedStatus: 200

    - name: "My-Page-Support-Links"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/mypage/support-links"
      expectedStatus: 200

    # --- [3] 주요 데이터 조회 (DB 연결성 확인) ---
    - name: "Get-User-Profile"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/member/infos"
      expectedStatus: 200

    - name: "Get-Follow-Lists"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/mypage/follows?status=PENDING"
      expectedStatus: 200

    - name: "Get-Post-Lists"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/boards/1/posts" # 존재하는 ID 가정
      expectedStatus: 200

    - name: "Get-Post-Comments-Sample"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/posts/1/comments" # 존재하는 ID 가정
      expectedStatus: 200

    - name: "Get-My-Posts"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/my/posts?size=20"
      expectedStatus: 200

    - name: "Get-My-Bookmarks"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/boards/my/bookmarks?size=20"
      expectedStatus: 200

    - name: "Get-Search-Posts"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/search/1/posts?q=hi"
      expectedStatus: 200

    - name: "Get-Chat-Rooms-My-List"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/chat/rooms"
      expectedStatus: 200

    - name: "Friend-Recommend-Logic"
      type: "INTERNAL"
      method: "GET"
      path: "/api/v1/commend/content-based"
      expectedStatus: 200

    # --- [5] 관리자/내부 도구 확인 ---
    - name: "Admin-User-Basic-Info"
      type: "ADMIN"
      method: "GET"
      path: "/api/admin/users/1/basic"
      expectedStatus: 200

    # --- 외부 의존성 확인 ---
    # --- [1] 인프라 생존 확인 (Actuator) ---
    - name: "Infra-Redis-Health"
      type: "INTERNAL"
      method: "GET"
      path: "/actuator/health/redis"
      expectedStatus: 200

    - name: "Infra-Naver-Mail-SMTP"
      type: "INTERNAL"
      method: "GET"
      path: "/actuator/health/mail"
      expectedStatus: 200

    # --- [2] NCP (Naver Cloud Platform) 의존성 ---
    - name: "Ext-NCP-Object-Storage"
      type: "EXTERNAL"
      method: "GET"
      path: "${ncp.s3.end-point}/${NCP_BUCKET_NAME}" # S3Config의 endpoint 주소
      expectedStatus: 200 # 인증 실패 시 403이 올 수 있으나 통로 확인용

    - name: "Ext-Google-Maps-API"
      type: "EXTERNAL"
      method: "GET"
      path: "https://maps.googleapis.com/maps/api/geocode/json"
      expectedStatus: 405 # API Key 없이 찔렀을 때 401이면 NCP 연결 성공

    # --- [3] 소셜 인증 및 푸시 (Auth & Firebase) ---
    - name: "Ext-Apple-Auth-Keys"
      type: "EXTERNAL"
      method: "GET"
      path: "https://appleid.apple.com/auth/keys"
      expectedStatus: 200

    - name: "Ext-Firebase-FCM"
      type: "EXTERNAL"
      method: "GET"
      path: "https://fcm.googleapis.com/fcm/send"
      expectedStatus: 200

    - name: "Ext-Google-OAuth"
      type: "EXTERNAL"
      method: "GET"
      path: "https://www.googleapis.com/oauth2/v3/userinfo"
      expectedStatus: 401

    # --- [4] 기타 인프라 체크 ---
    - name: "Infra-WebSocket-Endpoint"
      type: "INTERNAL"
      method: "GET"
      path: "/ws"
      expectedStatus: 400 # WebSocket은 일반 GET으로 찌르면 400(Bad Request) 반환이 정상 생존 신호


openai:
  api-key: ${OPEN_AI_KEY}