<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>카테고리 관리</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .category-list { list-style: none; padding: 0; margin-top: 20px; }
        .category-list li { background-color: #f9f9f9; border: 1px solid #ddd; padding: 10px 15px; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .category-list li form { display: inline; margin-left: 10px; }
        .category-list li button { background-color: #dc3545; color: white; border: none; padding: 3px 8px; font-size: 0.8em; cursor: pointer; border-radius: 3px;}
        .add-form { margin-top: 30px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; background-color: #f0f0f0; }
        .add-form input { padding: 8px; margin-right: 10px; }
        .add-form button { padding: 8px 15px; }
        .error, .field-error { color: red; font-size: 0.9em; } /* field-error 클래스 추가 */
        .success { color: green; font-weight: bold; margin-bottom: 10px;}
    </style>
</head>
<body>
<div class="container">
    <h1>게시판 카테고리 관리</h1>

    <div th:if="${successMessage}" class="success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>

    <h2>현재 카테고리 목록</h2>
    <ul class="category-list">
        <li th:each="board : ${boards}">
            <span th:text="${board.categoryName}"></span>
            <form th:action="@{/admin/boards/{id}/delete(id=${board.id})}" method="post" onsubmit="return confirm('경고: 이 카테고리와 관련된 모든 게시글, 댓글 등이 영구적으로 삭제됩니다. 정말 삭제하시겠습니까?');">
                <button type="submit">삭제</button>
            </form>
        </li>
    </ul>

    <h2>새 카테고리 추가</h2>
    <div class="add-form">
        <form th:action="@{/admin/boards}" method="post" th:object="${boardCreateRequest}">
            <label for="categoryName">카테고리 이름:</label>
            <input type="text" id="categoryName" th:field="*{categoryName}" placeholder="Enum 상수 이름 (예: FREE, NOTICE)">
            <button type="submit">추가</button>
            <div th:if="${#fields.hasErrors('categoryName')}" class="field-error" th:errors="*{categoryName}"></div>
        </form>
        <p style="font-size: 0.8em; color: #555; margin-top: 10px;">
            참고: 카테고리 이름은 `BoardCategory` Enum에 정의된 상수 이름과 정확히 일치해야 합니다 (대소문자 무시).
        </p>
    </div>

    <a th:href="@{/admin/users/home}" style="margin-top: 30px; display: inline-block;">← 관리자 홈으로</a>
</div>
</body>
</html>
