<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<div class="pagination"
     th:fragment="pagination(page, paramName)"
     th:if="${page.totalPages > 1}">

    <a th:if="${page.hasPrevious()}"
       th:href="@{/admin/users/{id}(
         id=${user.userId},
         followPage=${paramName == 'followPage' ? page.number - 1 : followings.number},
         blockPage=${paramName == 'blockPage' ? page.number - 1 : blockedUsers.number},
         chatPage=${paramName == 'chatPage' ? page.number - 1 : chatRooms.number},
         postPage=${paramName == 'postPage' ? page.number - 1 : posts.number},
         commentPage=${paramName == 'commentPage' ? page.number - 1 : comments.number},
         messagePage=${paramName == 'messagePage' ? page.number - 1 : messages.number}
       )}">이전</a>

    <span class="active" th:text="|${page.number + 1} / ${page.totalPages}|"></span>

    <a th:if="${page.hasNext()}"
       th:href="@{/admin/users/{id}(
         id=${user.userId},
         followPage=${paramName == 'followPage' ? page.number + 1 : followings.number},
         blockPage=${paramName == 'blockPage' ? page.number + 1 : blockedUsers.number},
         chatPage=${paramName == 'chatPage' ? page.number + 1 : chatRooms.number},
         postPage=${paramName == 'postPage' ? page.number + 1 : posts.number},
         commentPage=${paramName == 'commentPage' ? page.number + 1 : comments.number},
         messagePage=${paramName == 'messagePage' ? page.number + 1 : messages.number}
       )}">다음</a>

</div>

</body>
</html>
