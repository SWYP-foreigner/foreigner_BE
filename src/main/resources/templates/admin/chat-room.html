<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Direct Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <style>
        body { background-color: #f4f6f9; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; }

        .layout-container { display: flex; height: 100vh; max-width: 100%; margin: 0 auto; background: white; }

        .sidebar { width: 400px; border-right: 1px solid #dee2e6; display: flex; flex-direction: column; background-color: #ffffff; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #dee2e6; background-color: #f8f9fa; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .room-list { flex: 1; overflow-y: auto; }
        .room-item { display: flex; padding: 15px 20px; border-bottom: 1px solid #f1f1f1; cursor: pointer; transition: background-color 0.2s; }
        .room-item:hover { background-color: #f8f9fa; }
        .room-item.active { background-color: #e7f1ff; border-left: 4px solid #007bff; }

        .avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-right: 15px; border: 1px solid #dee2e6; }
        .room-info { flex: 1; min-width: 0; }
        .room-name { font-weight: 600; color: #343a40; margin-bottom: 4px; font-size: 0.95rem; }
        .last-msg { color: #868e96; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .msg-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
        .time-text { font-size: 0.75rem; color: #adb5bd; }
        .badge-unread { background-color: #ff5b5b; color: white; border-radius: 12px; padding: 2px 8px; font-size: 0.7rem; font-weight: bold; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: #fff; }
        .chat-header { height: 70px; padding: 0 25px; border-bottom: 1px solid #dee2e6; display: flex; align-items: center; background-color: #ffffff; font-size: 1.1rem; font-weight: 600; }

        .messages-wrapper { flex: 1; padding: 20px; overflow-y: auto; background-color: #b2c7d9; display: flex; flex-direction: column; }
        .messages-container { display: flex; flex-direction: column; justify-content: flex-start; min-height: 100%; }

        .msg-row { display: flex; margin-bottom: 15px; align-items: flex-end; }
        .msg-row.mine { flex-direction: row-reverse; }
        .msg-row.other { flex-direction: row; }

        .msg-bubble { max-width: 70%; padding: 10px 14px; border-radius: 15px; position: relative; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
        .mine .msg-bubble { background-color: #ffe000; color: #333; border-top-right-radius: 2px; margin-right: 8px; }
        .other .msg-bubble { background-color: #ffffff; border: 1px solid #eee; color: #333; border-top-left-radius: 2px; margin-left: 8px; }

        .sender-name { font-size: 0.8rem; color: #555; margin-bottom: 4px; margin-left: 8px; }
        .timestamp { font-size: 0.7rem; color: #555; margin: 0 5px; }

        .input-area { padding: 20px; background-color: #f8f9fa; border-top: 1px solid #dee2e6; }
        .input-group-custom { display: flex; background: white; border: 1px solid #ced4da; border-radius: 20px; padding: 5px; }
        .input-group-custom textarea { flex: 1; border: none; resize: none; height: 50px; padding: 12px; border-radius: 20px; outline: none; }
        .btn-send { width: 50px; height: 50px; border: none; background-color: #ffe000; border-radius: 50%; margin-left: 10px; color: #333; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .btn-send:hover { background-color: #ffd000; }

        .empty-view { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #adb5bd; }
        .img-msg { max-width: 200px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="layout-container">
    <div class="sidebar">
        <div class="sidebar-header">
            <span><i class="fas fa-comments me-2"></i>채팅 목록</span>
            <button class="btn btn-sm btn-outline-secondary" onclick="loadRooms()">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
        <div id="roomList" class="room-list"></div>
    </div>

    <div class="chat-area">
        <div id="chatHeader" class="chat-header" style="display: none;">
            <div class="d-flex align-items-center">
                <span id="roomNameTitle"></span>
                <span id="roomCountTitle" class="ms-2 text-muted" style="font-size: 0.9rem;"></span>
            </div>
        </div>

        <div id="emptyView" class="empty-view">
            <i class="far fa-paper-plane fa-3x mb-3"></i>
            <h4>대화 상대를 선택해주세요</h4>
        </div>

        <div id="msgWrapper" class="messages-wrapper" style="display: none;">
            <div id="msgContainer" class="messages-container"></div>
        </div>

        <div id="inputArea" class="input-area" style="display: none;">
            <div class="input-group-custom">
                <textarea id="msgInput" placeholder="메시지를 입력하세요 (Shift+Enter: 줄바꿈)"></textarea>
                <button class="btn-send" onclick="sendMsg()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<input type="hidden" id="myUserId" th:value="${currentUserId}">
<input type="hidden" id="myAccessToken" th:value="${accessToken}">

<script>
    let stompClient = null;
    let currentRoomId = null;
    let currentSubscription = null;

    const myUserId = document.getElementById('myUserId').value;
    const myAccessToken = document.getElementById('myAccessToken').value;

    const msgContainer = document.getElementById('msgContainer');
    const msgWrapper = document.getElementById('msgWrapper');

    document.addEventListener('DOMContentLoaded', () => {
        connectStomp();
        loadRooms();

        document.getElementById('msgInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMsg();
            }
        });
    });

    function connectStomp() {
        const protocol = (location.protocol === 'https:') ? 'wss:' : 'ws:';
        const socketUrl = `${protocol}//${location.host}/ws`;

        stompClient = Stomp.client(socketUrl);

        const headers = {};
        if (myAccessToken) headers['Authorization'] = 'Bearer ' + myAccessToken;

        stompClient.connect(headers, function(frame) {
            console.log('STOMP Connected');

            const roomListTopic = `/topic/user/${myUserId}/rooms`;
            stompClient.subscribe(roomListTopic, function(payload) {
                const response = JSON.parse(payload.body);
                if (response.type === 'ROOM_UPDATE') {
                    loadRooms();
                }
            });

        }, function(error) {
            console.error('STOMP Error:', error);
            setTimeout(connectStomp, 5000);
        });
    }

    function loadRooms() {
        const headers = {};
        if (myAccessToken) headers['Authorization'] = 'Bearer ' + myAccessToken;

        fetch('/admin/direct-chat/api/rooms', { headers: headers })
            .then(res => res.json())
            .then(rooms => {
                const listEl = document.getElementById('roomList');
                listEl.innerHTML = '';

                rooms.forEach(room => {
                    const el = document.createElement('div');
                    el.className = `room-item ${currentRoomId === room.roomId ? 'active' : ''}`;
                    el.onclick = () => enterRoom(room);

                    const img = room.roomImageUrl || 'https://via.placeholder.com/50?text=U';
                    const timeStr = formatTime(room.lastMessageTime);
                    const lastMsg = room.lastMessageContent || '(내용 없음)';

                    let displayUnread = room.unreadCount;
                    if (currentRoomId === room.roomId) {
                        displayUnread = 0;
                    }

                    el.innerHTML = `
                        <img src="${img}" class="avatar">
                        <div class="room-info">
                            <div class="d-flex justify-content-between">
                                <span class="room-name">${room.roomName}</span>
                                <span class="time-text">${timeStr}</span>
                            </div>
                            <div class="msg-meta">
                                <span class="last-msg">${lastMsg}</span>
                                ${displayUnread > 0 ? `<span class="badge-unread">${displayUnread}</span>` : ''}
                            </div>
                        </div>
                    `;
                    listEl.appendChild(el);
                });
            })
            .catch(err => console.error(err));
    }

    function enterRoom(room) {
        currentRoomId = room.roomId;

        document.getElementById('emptyView').style.display = 'none';
        document.getElementById('chatHeader').style.display = 'flex';
        msgWrapper.style.display = 'flex';
        document.getElementById('inputArea').style.display = 'block';

        document.getElementById('roomNameTitle').innerText = room.roomName;
        document.getElementById('roomCountTitle').innerText = `(${room.participantCount}명)`;

        loadRooms();
        msgContainer.innerHTML = '';

        if (currentSubscription) currentSubscription.unsubscribe();

        const headers = {};
        if (myAccessToken) headers['Authorization'] = 'Bearer ' + myAccessToken;

        fetch(`/admin/direct-chat/api/rooms/${room.roomId}/messages`, { headers: headers })
            .then(res => res.json())
            .then(messages => {
                if (!Array.isArray(messages)) return;
                messages.reverse().forEach(msg => renderMessage(msg));
                scrollToBottom();
            })
            .catch(err => console.error("Msg Load Fail:", err));

        const subscribeUrl = `/topic/user/${myUserId}/${room.roomId}/messages`;

        if (stompClient && stompClient.connected) {
            currentSubscription = stompClient.subscribe(subscribeUrl, function(payload) {
                const response = JSON.parse(payload.body);

                if (response.type === 'NEW_MESSAGE' || response.type === 'MESSAGE') {
                    const msg = response.data ? response.data : response;

                    if (String(msg.senderId) !== String(myUserId)) {
                        renderMessage(msg);
                        scrollToBottom();
                    }
                }
            });
        }
    }

    function renderMessage(msg) {
        const isMine = (String(msg.senderId) === String(myUserId));
        const row = document.createElement('div');
        row.className = `msg-row ${isMine ? 'mine' : 'other'}`;

        let contentHtml = msg.originContent;

        if (msg.messageType === 'IMAGE') {
            contentHtml = `<img src="${msg.mediaUrl}" class="img-msg" onclick="window.open(this.src)">`;
        } else if (msg.messageType === 'VIDEO') {
            contentHtml = `<video src="${msg.mediaUrl}" controls style="max-width:200px; border-radius:10px;"></video>`;
        }

        if (!contentHtml && msg.messageType === 'TEXT') {
            contentHtml = '(내용 없음)';
        }

        if (msg.targetContent) {
            contentHtml += `<hr style="margin:5px 0; border-color:#ccc; border-style:dashed;">`;
            contentHtml += `<small class="text-secondary">${msg.targetContent}</small>`;
        }

        let nameHtml = '';
        if (!isMine) {
            nameHtml = `<div class="sender-name">${msg.senderFirstName || 'Unknown'}</div>`;
        }

        const timeStr = formatTime(msg.sentAt);
        const bubbleHtml = `<div class="msg-bubble">${contentHtml}</div>`;
        const timeHtml = `<span class="timestamp">${timeStr}</span>`;

        let innerHTML = '';
        if (isMine) {
            innerHTML = timeHtml + bubbleHtml;
        } else {
            innerHTML = `
                <div>
                    ${nameHtml}
                    <div style="display:flex; align-items:flex-end;">
                        ${bubbleHtml} ${timeHtml}
                    </div>
                </div>
            `;
        }

        row.innerHTML = innerHTML;
        msgContainer.appendChild(row);
    }

    function sendMsg() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text || !currentRoomId) return;

        const req = {
            roomId: currentRoomId,
            senderId: myUserId,
            content: text,
            type: 'TEXT'
        };

        const previewMsg = {
            senderId: myUserId,
            originContent: text,
            messageType: 'TEXT',
            sentAt: new Date().toISOString()
        };
        renderMessage(previewMsg);
        scrollToBottom();

        const headers = {};
        if (myAccessToken) headers['Authorization'] = 'Bearer ' + myAccessToken;

        stompClient.send("/app/chat.sendMessage", headers, JSON.stringify(req));
        input.value = '';
    }

    function scrollToBottom() {
        setTimeout(() => {
            msgWrapper.scrollTop = msgWrapper.scrollHeight;
        }, 50);
    }

    function formatTime(isoString) {
        if (!isoString) return '';
        const date = new Date(isoString);
        return date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    }
</script>

</body>
</html>
