<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>채팅 내용 검색</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px;}
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: middle; }
        th { background-color: #f2f2f2; }
        th a { text-decoration: none; color: black; display: block; width: 100%; }
        th a.sorted { font-weight: bold; color: #007bff; }
        .pagination { margin-top: 20px; text-align: center; }
        .pagination a, .pagination span { margin: 0 5px; text-decoration: none; }
        .pagination .active { font-weight: bold; color: black; }
        .search-form { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .search-form input { padding: 5px; margin-right: 10px; }
        .search-form button { padding: 5px 10px; }
        td small { color: #777; }
        td a { text-decoration: none; color: #007bff; }
        td a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<h1>채팅 내용 검색</h1>

<div class="search-form">
    <form th:action="@{/admin/chats/search}" method="get" th:object="${searchRequest}">
        <input type="text" name="keyword" th:value="*{keyword}" placeholder="내용 키워드">
        <input type="text" name="senderEmail" th:value="*{senderEmail}" placeholder="발신자 이메일">
        <input type="text" name="senderName" th:value="*{senderName}" placeholder="발신자 이름">
        <button type="submit">검색</button>
    </form>
</div>

<table th:if="${messagePage != null and messagePage.hasContent()}">
    <thead>
    <tr>
        <th>메시지ID</th>
        <th>채팅방</th>
        <th>발신자</th>
        <th>내용</th>
        <th>전송 시각</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="msg : ${messagePage.content}">
        <td th:text="${msg.messageId}"></td>
        <td>
            <a th:if="${msg.chatRoomId != null}" th:href="@{/admin/chats/{id}(id=${msg.chatRoomId})}" th:text="${msg.roomName}"></a>
            <span th:unless="${msg.chatRoomId != null}" th:text="${msg.roomName}"> (링크 불가)</span><br>
            <small th:text="'(ID: ' + ${msg.chatRoomId} + ')'"></small>
        </td>
        <td>
            <a th:if="${msg.senderId != null}" th:href="@{/admin/users/{id}(id=${msg.senderId})}" th:text="${msg.senderName}"></a>
            <span th:unless="${msg.senderId != null}" th:text="${msg.senderName}"> (링크 불가)</span><br>
            <small th:text="${msg.senderEmail}"></small>
        </td>
        <td th:text="${msg.content}"></td>
        <td th:text="${#temporals.format(msg.sentAt, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
    </tbody>
</table>
<p th:if="${messagePage == null or !messagePage.hasContent() and (searchRequest.keyword != null or searchRequest.senderEmail != null or searchRequest.senderName != null)}">
    검색 결과가 없습니다.
</p>

<div class="pagination" th:if="${messagePage != null and messagePage.totalPages > 1}">
    <a th:if="${messagePage.hasPrevious()}"
       th:href="@{/admin/chats/search(page=${messagePage.number - 1}, sort=${param.sort}, keyword=${searchRequest.keyword}, senderEmail=${searchRequest.senderEmail}, senderName=${searchRequest.senderName})}">이전</a>
    <span th:each="pageNumber : ${#numbers.sequence(0, messagePage.totalPages - 1)}">
            <a th:href="@{/admin/chats/search(page=${pageNumber}, sort=${param.sort}, keyword=${searchRequest.keyword}, senderEmail=${searchRequest.senderEmail}, senderName=${searchRequest.senderName})}"
               th:text="${pageNumber + 1}"
               th:classappend="${pageNumber == messagePage.number} ? 'active'"></a>
        </span>
    <a th:if="${messagePage.hasNext()}"
       th:href="@{/admin/chats/search(page=${messagePage.number + 1}, sort=${param.sort}, keyword=${searchRequest.keyword}, senderEmail=${searchRequest.senderEmail}, senderName=${searchRequest.senderName})}">다음</a>
</div>

<a th:href="@{/admin/users/home}" style="margin-top: 30px; display: inline-block;">← 관리자 홈으로</a>
</body>
</html>
