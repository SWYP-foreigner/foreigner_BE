<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>국가 타겟팅 푸시 발송</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 25px; color: #333; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        textarea { height: 120px; resize: vertical; }

        .btn-send { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 1.1rem; cursor: pointer; transition: background 0.2s; }
        .btn-send:hover { background-color: #0056b3; }
        .btn-back { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; }

        .alert { padding: 15px; border-radius: 4px; margin-bottom: 20px; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 국가 타겟팅 푸시 발송</h1>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/admin/push/send}" method="post" th:object="${pushRequest}" onsubmit="return confirm('정말 발송하시겠습니까?\n대상 국가의 모든 유저에게 전송됩니다.');">

        <div class="form-group">
            <label for="targetCountry">타겟 국가 선택</label>
            <select id="targetCountry" th:field="*{targetCountry}" required>
                <option value="">-- 국가를 선택하세요 --</option>
                <option th:each="country : ${countries}"
                        th:value="${country}"
                        th:text="${country}"></option>
            </select>
            <p style="font-size: 0.85em; color: #888; margin-top: 5px;">* 현재 가입 유저가 존재하는 국가만 표시됩니다.</p>
        </div>

        <div class="form-group">
            <label for="title">알림 제목 (Title)</label>
            <input type="text" id="title" th:field="*{title}" placeholder="예: [공지] 한국 유저 한정 이벤트!" required>
        </div>

        <div class="form-group">
            <label for="body">알림 내용 (Body)</label>
            <textarea id="body" th:field="*{body}" placeholder="전달할 메시지 내용을 입력하세요." required></textarea>
        </div>

        <button type="submit" class="btn-send">푸시 알림 발송하기</button>
    </form>

    <a th:href="@{/admin/users/home}" class="btn-back">← 어드민 홈으로 돌아가기</a>
</div>

</body>
</html>
