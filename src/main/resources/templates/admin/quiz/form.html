<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>퀴즈 작성 및 수정</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; padding-top: 50px; }
        .container { background-color: white; width: 800px; padding: 40px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 30px; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; }
        input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        textarea { height: 120px; resize: vertical; }
        .option-item { display: flex; align-items: center; margin-bottom: 10px; gap: 10px; background: #f8f9fa; padding: 10px; border-radius: 5px; border: 1px solid #eee; }
        .radio-wrapper { display: flex; align-items: center; justify-content: center; width: 40px; }
        .option-input-wrapper { flex-grow: 1; }
        .btn-remove { background-color: #ff6b6b; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .btn-add { background-color: #20c997; color: white; border: none; padding: 10px; border-radius: 5px; width: 100%; cursor: pointer; margin-top: 10px; }
        .btn-submit { background-color: #007bff; color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-size: 18px; cursor: pointer; margin-top: 30px; }
        .btn-submit:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2 th:text="${quiz == null ? '🧩 새 퀴즈 만들기' : '✏️ 퀴즈 수정하기'}">퀴즈 관리</h2>

    <input type="hidden" id="quizId" th:value="${quiz?.id}">

    <form onsubmit="return submitQuiz(event)">
        <div class="form-group">
            <label for="content">게시글 본문 (Post Content)</label>

            <textarea id="content" placeholder="퀴즈와 함께 보여질 내용을 작성하세요." required
                      th:text="${quiz?.content}"></textarea>
        </div>

        <hr>

        <div class="form-group">
            <label for="title">퀴즈 질문 (Title)</label>
            <input type="text" id="title" placeholder="예: 대한민국의 수도는?" required th:value="${quiz?.title}">
        </div>

        <div class="form-group">
            <label for="description">힌트/설명</label>
            <input type="text" id="description" placeholder="선택사항" th:value="${quiz?.description}">
        </div>

        <div class="form-group">
            <label>선택지 관리 (정답 체크)</label>
            <div id="optionList">
                <th:block th:if="${quiz != null}">
                    <div class="option-item" th:each="opt, stat : ${quiz.options}">
                        <div class="radio-wrapper">
                            <input type="radio" name="correctOptionIndex"
                                   th:value="${stat.index}"
                                   th:checked="${quiz.correctOptionId == opt.optionId}">
                        </div>
                        <div class="option-input-wrapper">
                            <input type="text" name="options" class="opt-text"
                                   th:value="${opt.content}" required>
                        </div>
                        <button type="button" class="btn-remove" onclick="removeOption(this)">삭제</button>
                    </div>
                </th:block>

                <th:block th:if="${quiz == null}">
                    <div class="option-item">
                        <div class="radio-wrapper">
                            <input type="radio" name="correctOptionIndex" value="0" required>
                        </div>
                        <div class="option-input-wrapper">
                            <input type="text" name="options" class="opt-text" placeholder="옵션 1" required>
                        </div>
                        <button type="button" class="btn-remove" onclick="removeOption(this)">삭제</button>
                    </div>
                    <div class="option-item">
                        <div class="radio-wrapper">
                            <input type="radio" name="correctOptionIndex" value="1">
                        </div>
                        <div class="option-input-wrapper">
                            <input type="text" name="options" class="opt-text" placeholder="옵션 2" required>
                        </div>
                        <button type="button" class="btn-remove" onclick="removeOption(this)">삭제</button>
                    </div>
                </th:block>
            </div>
            <button type="button" class="btn-add" onclick="addOption()">+ 선택지 추가</button>
        </div>

        <button type="submit" class="btn-submit" th:text="${quiz == null ? '생성하기' : '수정하기'}">완료</button>
    </form>

    <a th:href="@{/admin/quizzes}" style="display:block; text-align:center; margin-top:20px; color:#666;">취소</a>
</div>

<script>
    function addOption() {
        const list = document.getElementById('optionList');
        const count = list.children.length;
        const div = document.createElement('div');
        div.className = 'option-item';
        div.innerHTML = `
            <div class="radio-wrapper"><input type="radio" name="correctOptionIndex" value="${count}"></div>
            <div class="option-input-wrapper"><input type="text" name="options" class="opt-text" placeholder="옵션 ${count+1}" required></div>
            <button type="button" class="btn-remove" onclick="removeOption(this)">삭제</button>
        `;
        list.appendChild(div);
    }

    function removeOption(btn) {
        const list = document.getElementById('optionList');
        if (list.children.length <= 2) {
            alert("최소 2개의 보기가 필요합니다!");
            return;
        }
        btn.closest('.option-item').remove();

        Array.from(list.children).forEach((row, idx) => {
            row.querySelector('input[type="radio"]').value = idx;
        });
    }

    async function submitQuiz(e) {
        e.preventDefault();

        const id = document.getElementById('quizId').value;
        const title = document.getElementById('title').value;
        const description = document.getElementById('description').value;
        const content = document.getElementById('content').value;

        const options = Array.from(document.querySelectorAll('.opt-text')).map(input => input.value);

        let correctOptionIndex = -1;
        document.querySelectorAll('input[name="correctOptionIndex"]').forEach((radio, idx) => {
            if (radio.checked) correctOptionIndex = idx;
        });

        if (correctOptionIndex === -1) {
            alert('정답을 선택해주세요!');
            return;
        }

        const bodyData = {
            title, description, content,
            options, correctOptionIndex
        };

        if (id) {
            bodyData.id = parseInt(id);
        }

        const url = '/api/v2/poll/quiz';
        const method = id ? 'PUT' : 'POST';

        try {
            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyData),
                credentials: 'include'
            });

            if (res.ok) {
                alert('저장되었습니다.');
                location.href = '/admin/quizzes';
            } else {
                let msg = '오류 발생';
                try {
                    const err = await res.json();
                    msg = err.message || msg;
                } catch(e) {
                    msg = await res.text();
                }
                alert('실패: ' + msg);
            }
        } catch (err) {
            console.error(err);
            alert('네트워크 오류');
        }
    }
</script>

</body>
</html>
