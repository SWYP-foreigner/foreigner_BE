<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>퀴즈 관리</title>
    <style>
        body { font-family: sans-serif; padding: 50px; background-color: #f4f6f9; }
        .form-container { background: white; padding: 30px; border-radius: 10px; max-width: 800px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .option-item { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .btn-submit { background-color: #007bff; color: white; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-add-option { background-color: #28a745; color: white; padding: 5px 15px; border: none; border-radius: 3px; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2 th:text="${quiz == null ? '새 퀴즈 작성' : '퀴즈 수정'}">퀴즈 관리</h2>

    <form id="quizForm">
        <input type="hidden" id="quizId" th:value="${quiz?.id}">

        <div class="form-group">
            <label>질문 내용 (title)</label>
            <input type="text" id="title" th:value="${quiz?.title}" placeholder="예: 대한민국의 수도는?" required>
        </div>

        <div class="form-group">
            <label>추가 설명 (description)</label>
            <input type="text" id="description" th:value="${quiz?.description}" placeholder="예: 지리 관련 상식입니다.">
        </div>

        <div class="form-group">
            <label>상세 본문 (content)</label>
            <textarea id="contentBody" rows="3" th:text="${quiz?.content}" placeholder="상세한 문제 내용을 입력하세요."></textarea>
        </div>

        <div th:if="${quiz == null}" class="form-group" style="border-top: 1px solid #eee; pt-20">
            <label>선택지 설정 (최소 2개)</label>
            <div id="optionsWrapper">
                <div class="option-item">
                    <input type="text" class="opt-text" placeholder="옵션 1" required>
                    <input type="radio" name="correctIdx" value="0" checked> 정답
                </div>
                <div class="option-item">
                    <input type="text" class="opt-text" placeholder="옵션 2" required>
                    <input type="radio" name="correctIdx" value="1"> 정답
                </div>
            </div>
            <button type="button" class="btn-add-option" onclick="addOptionField()">+ 옵션 추가</button>
        </div>

        <div class="admin-actions" style="margin-top: 30px;">
            <button type="button" class="btn-submit" onclick="submitQuiz()">저장하기</button>
            <a th:href="@{/admin/quizzes}" style="margin-left: 15px; text-decoration: none; color: #666;">돌아가기</a>
        </div>
    </form>
</div>

<script th:inline="javascript">
    // 쿠키에서 특정 이름의 값을 가져오는 함수
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
    }

    async function submitQuiz() {
        const id = document.getElementById('quizId').value;
        const title = document.getElementById('title').value;
        const description = document.getElementById('description').value;
        const content = document.getElementById('contentBody').value;

        // 쿠키 이름이 'accessToken'인지 확인 필요 (개발자 도구 Application -> Cookies에서 확인)
        const token = getCookie('accessToken');

        if (!token) {
            alert('인증 쿠키가 없습니다. 다시 로그인해주세요.');
            return;
        }

        let url = '/api/v2/poll/quiz';
        let method = id ? 'PUT' : 'POST';
        let bodyData = id ?
            { id: parseInt(id), title, description, content } :
            {
                title, description, content,
                options: Array.from(document.querySelectorAll('.opt-text')).map(input => input.value),
                correctOptionIndex: parseInt(document.querySelector('input[name="correctIdx"]:checked').value)
            };

        try {
            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` // 쿠키에서 뽑은 토큰 주입
                },
                body: JSON.stringify(bodyData)
            });

            if (response.ok) {
                alert('저장되었습니다.');
                location.href = '/admin/quizzes';
            } else {
                const err = await response.json();
                alert('실패: ' + (err.message || '알 수 없는 오류'));
            }
        } catch (error) {
            alert('네트워크 오류');
        }
    }
</script>

</body>
</html>
