<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>퀴즈 관리 목록</title>
    <style>
        body { font-family: sans-serif; padding: 50px; background-color: #f4f6f9; }
        .container { background: white; padding: 30px; border-radius: 10px; max-width: 1000px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 30px; }

        .top-actions { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .btn-create { background-color: #28a745; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #555; font-weight: bold; }

        .btn-edit { color: #007bff; text-decoration: none; margin-right: 15px; font-weight: bold; }
        .btn-delete { color: #dc3545; background: none; border: none; cursor: pointer; font-weight: bold; padding: 0; }

        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-active { background-color: #e3f2fd; color: #0d47a1; }

        .pagination { display: flex; justify-content: center; align-items: center; margin-top: 30px; gap: 5px; }
        .pagination a { text-decoration: none; padding: 8px 12px; border: 1px solid #ddd; color: #007bff; border-radius: 4px; transition: background-color 0.2s; }
        .pagination a:hover { background-color: #f2f2f2; }
        .pagination .active { background-color: #007bff; color: white; font-weight: bold; border-color: #007bff; }
        .pagination .disabled { color: #ccc; pointer-events: none; border-color: #eee; background-color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h1>❓ 퀴즈 관리 목록</h1>

    <div class="top-actions">
        <a th:href="@{/admin/quizzes/create}" class="btn-create">+ 새 퀴즈 작성</a>
    </div>

    <table>
        <thead>
        <tr>
            <th style="width: 10%;">ID</th>
            <th style="width: 45%;">제목</th>
            <th style="width: 15%;">참여수</th>
            <th style="width: 15%;">마감일</th>
            <th style="width: 15%;">관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="quiz : ${quizzes.content}">
            <td th:text="${quiz.id}">1</td>
            <td>
                <span th:text="${quiz.title}" style="font-weight: bold; font-size: 1.1em;">퀴즈 제목</span><br>
                <small th:text="${quiz.description}" style="color: #888;">설명 내용</small>
            </td>
            <td>
                <span class="badge badge-active">
                    👤 <span th:text="${quiz.totalVoteCount}">0</span>명
                </span>
            </td>
            <td th:text="${quiz.closeAt != null ? #temporals.format(quiz.closeAt, 'yyyy-MM-dd HH:mm') : '-'}">
                2026-12-31
            </td>
            <td>
                <a th:href="@{/admin/quizzes/{id}/edit(id=${quiz.id})}" class="btn-edit">수정</a>
                <button type="button" class="btn-delete" th:onclick="|deleteQuiz(${quiz.id})|">삭제</button>
            </td>
        </tr>
        <tr th:if="${quizzes.totalElements == 0}">
            <td colspan="5" style="text-align: center; color: #999; padding: 50px;">
                등록된 퀴즈가 없습니다.
            </td>
        </tr>
        </tbody>
    </table>

    <div class="pagination" th:if="${quizzes.totalPages > 0}"
         th:with="start=${T(java.lang.Math).max(0, quizzes.number - 10)},
                  end=${T(java.lang.Math).min(quizzes.totalPages - 1, quizzes.number + 10)}">

        <a th:href="@{/admin/quizzes(page=0)}"
           th:classappend="${quizzes.first} ? 'disabled'">&lt;&lt;</a>

        <a th:href="@{/admin/quizzes(page=${quizzes.number - 1})}"
           th:classappend="${quizzes.first} ? 'disabled'">&lt;</a>

        <th:block th:each="pageNumber : ${#numbers.sequence(start, end)}">
            <a th:href="@{/admin/quizzes(page=${pageNumber})}"
               th:text="${pageNumber + 1}"
               th:classappend="${pageNumber == quizzes.number} ? 'active'">1</a>
        </th:block>

        <a th:href="@{/admin/quizzes(page=${quizzes.number + 1})}"
           th:classappend="${quizzes.last} ? 'disabled'">&gt;</a>

        <a th:href="@{/admin/quizzes(page=${quizzes.totalPages - 1})}"
           th:classappend="${quizzes.last} ? 'disabled'">&gt;&gt;</a>
    </div>

    <div style="margin-top: 30px; text-align: center;">
        <a th:href="@{/admin/users/home}" style="color: #666; text-decoration: none;">⬅️ 관리자 메인으로</a>
    </div>
</div>

<script th:inline="javascript">
    async function deleteQuiz(id) {
        if (!confirm('정말 이 퀴즈를 삭제하시겠습니까? 관련 데이터가 모두 삭제됩니다.')) return;

        try {
            // [주의] 실제 컨트롤러에 DELETE 메서드가 구현되어 있어야 함
            // 예: /api/v2/poll/{id}
            const response = await fetch(`/api/v2/poll/${id}`, {
                method: 'DELETE',
                credentials: 'include'
            });

            if (response.ok) {
                alert('삭제되었습니다.');
                location.reload();
            } else {
                let msg = '삭제 실패';
                try {
                    const text = await response.text();
                    const json = JSON.parse(text);
                    msg = json.message || msg;
                } catch (e) {}
                alert(msg);
            }
        } catch (error) {
            console.error(error);
            alert('서버 통신 중 오류가 발생했습니다.');
        }
    }
</script>

</body>
</html>
