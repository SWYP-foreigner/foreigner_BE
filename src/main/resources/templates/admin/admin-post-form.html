<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>자체 포스트 등록</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .btn-back {
            display: inline-block;
            margin-bottom: 15px;
            padding: 8px 12px;
            background-color: #6c757d; color: white;
            text-decoration: none; border-radius: 4px;
        }
        .btn-back:hover { background-color: #5a6268; }
        .message { padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .post-form-container {
            margin-top: 20px; padding: 20px; background-color: #f8f9fa;
            border: 1px solid #ddd; border-radius: 5px;
        }
        .post-form-container div { margin-bottom: 15px; }
        .post-form-container label { display: block; margin-bottom: 5px; font-weight: bold; }
        .post-form-container input[type="text"],
        .post-form-container textarea,
        .post-form-container select {
            width: 100%; padding: 8px; box-sizing: border-box;
            border: 1px solid #ccc; border-radius: 4px;
        }
        .btn-submit {
            padding: 8px 12px; background-color: #007bff; border-color: #007bff;
            color: white; border: none; border-radius: 4px; cursor: pointer;
        }
        #file-list { margin-top: 10px; }
        .file-item {
            display: flex; justify-content: space-between; align-items: center;
            background: white; padding: 5px 10px; margin-bottom: 5px;
            border: 1px solid #ddd; border-radius: 4px;
        }
        .btn-remove {
            background-color: #dc3545; color: white; border: none;
            border-radius: 3px; padding: 2px 6px; cursor: pointer; margin-left: 10px;
        }
    </style>

    <script>
        const dataTransfer = new DataTransfer();

        function handleFiles(input) {
            const files = input.files;
            const maxFiles = 5;

            if (dataTransfer.items.length + files.length > maxFiles) {
                alert('이미지는 최대 ' + maxFiles + '개까지만 선택할 수 있습니다.');
                input.value = '';
                input.files = dataTransfer.files;
                return;
            }

            for (let i = 0; i < files.length; i++) {
                dataTransfer.items.add(files[i]);
            }

            input.files = dataTransfer.files;
            updateFileList();
        }

        function removeFile(index) {
            dataTransfer.items.remove(index);
            const input = document.getElementById('images');
            input.files = dataTransfer.files;
            updateFileList();
        }

        function updateFileList() {
            const listContainer = document.getElementById('file-list');
            listContainer.innerHTML = '';

            const files = dataTransfer.files;

            for (let i = 0; i < files.length; i++) {
                const div = document.createElement('div');
                div.className = 'file-item';

                const nameSpan = document.createElement('span');
                nameSpan.innerText = files[i].name;

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'btn-remove';
                removeBtn.innerText = '삭제';
                removeBtn.onclick = function() { removeFile(i); };

                div.appendChild(nameSpan);
                div.appendChild(removeBtn);
                listContainer.appendChild(div);
            }
        }
    </script>
</head>
<body>
<h1>📝 자체 포스트 등록 </h1>

<div th:if="${errorMessage}" class="message error" th:text="${errorMessage}"></div>
<div th:if="${successMessage}" class="message success" th:text="${successMessage}"></div>

<a th:href="@{/admin/crawled-data}" class="btn-back">← 목록으로 돌아가기</a>

<div class="post-form-container">
    <form th:action="@{/admin/posts/custom}" method="POST" enctype="multipart/form-data">

        <div>
            <label for="boardCategory">게시판 선택:</label>
            <select id="boardCategory" name="boardCategory" required>
                <option value="" disabled selected>-- 카테고리 선택 --</option>
                <option value="NEWS">News</option>
                <option value="TIP">Tip</option>
                <option value="QNA">Q&A</option>
                <option value="EVENT">Event</option>
                <option value="FREE_TALK">Free talk</option>
                <option value="ACTIVITY">Activity</option>
            </select>
        </div>

        <div>
            <label for="content">본문:</label>
            <textarea id="content" name="content" rows="10" required></textarea>
        </div>

        <div>
            <label for="images">이미지 (다중 선택 가능, 최대 5개):</label>
            <input type="file" id="images" name="images" multiple accept="image/*" onchange="handleFiles(this)">
            <div id="file-list"></div>
        </div>

        <div>
            <button type="submit" class="btn-submit">
                포스트 등록하기
            </button>
        </div>
    </form>
</div>
</body>
</html>
