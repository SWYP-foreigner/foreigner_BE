<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>채팅방 관리</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px;}
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: middle; }
        th { background-color: #f2f2f2; }
        th a { text-decoration: none; color: black; display: block; width: 100%; }
        th a.sorted { font-weight: bold; color: #007bff; }
        .pagination { margin-top: 20px; text-align: center; }
        .pagination a, .pagination span { margin: 0 5px; text-decoration: none; }
        .pagination .active { font-weight: bold; color: black; }
        .search-form { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .search-form input { padding: 5px; margin-right: 10px; }
        .search-form button { padding: 5px 10px; }
        td a { text-decoration: none; color: #007bff; }
        td a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<h1>채팅방 목록</h1>

<div class="search-form">
    <form th:action="@{/admin/chats}" method="get" th:object="${searchRequest}">
        <input type="text" name="roomName" th:value="*{roomName}" placeholder="채팅방 이름 검색">
        <button type="submit">검색</button>
    </form>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>방 이름</th>
        <th>유형</th>
        <th>참여자 수</th>
        <th>생성일</th>
        <th>관리</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="room : ${chatRoomPage.content}">
        <td th:text="${room.chatRoomId}"></td>
        <td th:text="${room.roomName}"></td>
        <td th:text="${room.isGroup} ? '그룹' : '1:1'"></td>
        <td th:text="${room.participantCount}"></td>
        <td th:text="${#temporals.format(room.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td>
            <a th:href="@{/admin/chats/{id}(id=${room.chatRoomId})}">참여자 보기</a>
        </td>
    </tr>
    </tbody>
</table>

<div class="pagination" th:if="${chatRoomPage.totalPages > 1}">
    <a th:if="${chatRoomPage.hasPrevious()}"
       th:href="@{/admin/chats(page=${chatRoomPage.number - 1}, sort=${param.sort}, roomName=${searchRequest.roomName})}">이전</a>

    <span th:each="pageNumber : ${#numbers.sequence(0, chatRoomPage.totalPages - 1)}">
            <a th:href="@{/admin/chats(page=${pageNumber}, sort=${param.sort}, roomName=${searchRequest.roomName})}"
               th:text="${pageNumber + 1}"
               th:classappend="${pageNumber == chatRoomPage.number} ? 'active'"></a>
        </span>

    <a th:if="${chatRoomPage.hasNext()}"
       th:href="@{/admin/chats(page=${chatRoomPage.number + 1}, sort=${param.sort}, roomName=${searchRequest.roomName})}">다음</a>
</div>

<a th:href="@{/admin/users/home}" style="margin-top: 30px; display: inline-block;">← 관리자 홈으로</a>

</body>
</html>
