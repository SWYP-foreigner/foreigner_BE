<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>채팅방 상세 정보</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        h1, h2 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .room-info { background-color: #f9f9f9; border: 1px solid #ddd; padding: 15px; border-radius: 5px; margin-bottom: 30px; }
        .room-info p { margin: 5px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px;}
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: middle; }
        th { background-color: #f2f2f2; }
        .pagination { margin-top: 20px; text-align: center; }
        .pagination a, .pagination span { margin: 0 5px; text-decoration: none; }
        .pagination .active { font-weight: bold; color: black; }
    </style>
</head>
<body>
<div class="container">
    <h1>채팅방 상세 정보</h1>

    <div class="room-info" th:object="${chatRoom}">
        <h2>기본 정보</h2>
        <p><strong>채팅방 ID:</strong> <span th:text="*{id}"></span></p>
        <p><strong>방 이름:</strong> <span th:text="*{roomName}"></span></p>
        <p><strong>유형:</strong> <span th:text="*{isGroup} ? '그룹' : '1:1'"></span></p>
        <p><strong>생성일:</strong> <span th:text="${#temporals.format(chatRoom.createdAt, 'yyyy-MM-dd HH:mm')}"></span></p>
    </div>

    <h2>참여자 목록</h2>
    <table>
        <thead>
        <tr>
            <th>참여자 ID</th>
            <th>사용자 ID</th>
            <th>사용자 이름</th>
            <th>참여 시각</th>
            <th>상태</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${participantPage.content}">
            <td th:text="${p.participantId}"></td>
            <td th:text="${p.userId}"></td>
            <td th:text="${p.userName}"></td>
            <td th:text="${#temporals.format(p.joinedAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${p.status}"></td>
        </tr>
        </tbody>
    </table>

    <div class="pagination" th:if="${participantPage.totalPages > 1}">
        <a th:if="${participantPage.hasPrevious()}"
           th:href="@{/admin/chats/{roomId}(roomId=${chatRoom.id}, page=${participantPage.number - 1}, sort=${param.sort})}">이전</a>
        <span th:each="pageNumber : ${#numbers.sequence(0, participantPage.totalPages - 1)}">
            <a th:href="@{/admin/chats/{roomId}(roomId=${chatRoom.id}, page=${pageNumber}, sort=${param.sort})}"
               th:text="${pageNumber + 1}"
               th:classappend="${pageNumber == participantPage.number} ? 'active'"></a>
        </span>
        <a th:if="${participantPage.hasNext()}"
           th:href="@{/admin/chats/{roomId}(roomId=${chatRoom.id}, page=${participantPage.number + 1}, sort=${param.sort})}">다음</a>
    </div>

    <a th:href="@{/admin/chats}" style="margin-top: 30px; display: inline-block;">← 채팅방 목록으로</a>
</div>
</body>
</html>
