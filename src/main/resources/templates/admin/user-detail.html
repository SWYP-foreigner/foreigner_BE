<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>사용자 상세 정보</title>
    <style>
        body { font-family: sans-serif; } .container { display: flex; gap: 20px; padding: 20px; } .main-info, .related-info { border: 1px solid #ccc; padding: 20px; border-radius: 5px; } .main-info { flex-basis: 40%; } .related-info { flex-basis: 60%; } h1, h2 { border-bottom: 2px solid #f2f2f2; padding-bottom: 10px; } table { width: 100%; border-collapse: collapse; margin-top: 15px; } th, td { border: 1px solid #ddd; padding: 8px; text-align: left; } th { background-color: #f2f2f2; } .pagination { margin-top: 10px; text-align: center; } .pagination a, .pagination span { margin: 0 5px; } .pagination .active { font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-info">
        <h1>사용자 상세 정보</h1>
        <a th:href="@{/admin/users}" style="margin-top: 20px; display: block;">← 목록으로 돌아가기</a>
    </div>

    <div class="related-info">
        <h2>친구 목록</h2>
        <table>
            <thead><tr><th>ID</th><th>이름</th><th>이메일</th></tr></thead>
            <tbody>
            <tr th:each="f : ${followings.content}">
                <td th:text="${f.targetUserId}"></td>
                <td th:text="${f.targetUserName}"></td>
                <td th:text="${f.targetUserEmail}"></td>
            </tr>
            </tbody>
        </table>
        <div th:replace="~{admin/fragments/pagination :: pagination('followPage', ${followings}, ${blockedUsers.number}, ${chatRooms.number})}"></div>

        <h2 style="margin-top: 30px;">차단 목록</h2>
        <table>
            <thead><tr><th>ID</th><th>이름</th><th>이메일</th></tr></thead>
            <tbody>
            <tr th:each="b : ${blockedUsers.content}">
                <td th:text="${b.targetUserId}"></td>
                <td th:text="${b.targetUserName}"></td>
                <td th:text="${b.targetUserEmail}"></td>
            </tr>
            </tbody>
        </table>
        <div th:replace="~{admin/fragments/pagination :: pagination('blockPage', ${blockedUsers}, ${followings.number}, ${chatRooms.number})}"></div>

        <h2 style="margin-top: 30px;">참여 채팅방</h2>
        <table>
            <thead><tr><th>ID</th><th>방 이름</th><th>그룹 여부</th><th>참여자 수</th></tr></thead>
            <tbody>
            <tr th:each="c : ${chatRooms.content}">
                <td th:text="${c.chatRoomId}"></td>
                <td th:text="${c.roomName}"></td>
                <td th:text="${c.isGroup} ? '그룹' : '1:1'"></td>
                <td th:text="${c.participantCount}"></td>
            </tr>
            </tbody>
        </table>
        <div th:replace="~{admin/fragments/pagination :: pagination('chatPage', ${chatRooms}, ${followings.number}, ${blockedUsers.number})}"></div>
    </div>
</div>

</body>
</html>
