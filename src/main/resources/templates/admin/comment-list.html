<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>댓글 관리</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px;}
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: middle; }
        th { background-color: #f2f2f2; }
        th a { text-decoration: none; color: black; display: block; width: 100%; }
        th a.sorted { font-weight: bold; color: #007bff; }
        .pagination { margin-top: 20px; text-align: center; }
        .pagination a, .pagination span { margin: 0 5px; text-decoration: none; }
        .pagination .active { font-weight: bold; color: black; }
        .search-form { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .search-form input, .search-form label { padding: 5px; margin-right: 10px; }
        .search-form button { padding: 5px 10px; }
        td small { color: #777; }
    </style>
</head>
<body>
<h1>댓글 관리</h1>

<div class="search-form">
    <form th:action="@{/admin/comments}" method="get" th:object="${searchRequest}">
        <input type="text" name="authorEmail" th:value="*{authorEmail}" placeholder="작성자 이메일">
        <input type="text" name="authorName" th:value="*{authorName}" placeholder="작성자 이름">
        <input type="text" name="content" th:value="*{content}" placeholder="내용 검색">
        <input type="date" name="startDate" th:value="*{startDate}"> ~
        <input type="date" name="endDate" th:value="*{endDate}">
        <label>
            <input type="checkbox" name="onlyReported" value="true" th:checked="*{onlyReported}">
            신고된 댓글만 보기
        </label>
        <button type="submit">검색</button>
    </form>
</div>

<table>
    <thead>
    <tr>
        <th>
            <a th:href="@{/admin/comments(sort=${commentPage.sort.getOrderFor('id')!=null&&commentPage.sort.getOrderFor('id').isDescending()}?'id,asc':'id,desc', authorEmail=${searchRequest.authorEmail}, authorName=${searchRequest.authorName}, content=${searchRequest.content}, onlyReported=${searchRequest.onlyReported})}">
                ID <span th:if="${commentPage.sort.getOrderFor('id') != null}" th:text="${commentPage.sort.getOrderFor('id').isAscending()} ? '▲' : '▼'"></span>
            </a>
        </th>
        <th>게시글ID</th>
        <th>
            <a th:href="@{/admin/comments(sort=${commentPage.sort.getOrderFor('authorName')!=null&&commentPage.sort.getOrderFor('authorName').isDescending()}?'authorName,asc':'authorName,desc', authorEmail=${searchRequest.authorEmail}, authorName=${searchRequest.authorName}, content=${searchRequest.content}, onlyReported=${searchRequest.onlyReported})}">
                작성자 <span th:if="${commentPage.sort.getOrderFor('authorName') != null}" th:text="${commentPage.sort.getOrderFor('authorName').isAscending()} ? '▲' : '▼'"></span>
            </a>
        </th>
        <th>내용</th>
        <th>
            <a th:href="@{/admin/comments(sort=${commentPage.sort.getOrderFor('createdAt')!=null&&commentPage.sort.getOrderFor('createdAt').isDescending()}?'createdAt,asc':'createdAt,desc', authorEmail=${searchRequest.authorEmail}, authorName=${searchRequest.authorName}, content=${searchRequest.content}, onlyReported=${searchRequest.onlyReported})}">
                작성일 <span th:if="${commentPage.sort.getOrderFor('createdAt') != null}" th:text="${commentPage.sort.getOrderFor('createdAt').isAscending()} ? '▲' : '▼'"></span>
            </a>
        </th>
        <th>
            <a th:href="@{/admin/comments(sort=${commentPage.sort.getOrderFor('reportCount')!=null&&commentPage.sort.getOrderFor('reportCount').isDescending()}?'reportCount,asc':'reportCount,desc', authorEmail=${searchRequest.authorEmail}, authorName=${searchRequest.authorName}, content=${searchRequest.content}, onlyReported=${searchRequest.onlyReported})}">
                신고 수 <span th:if="${commentPage.sort.getOrderFor('reportCount') != null}" th:text="${commentPage.sort.getOrderFor('reportCount').isAscending()} ? '▲' : '▼'"></span>
            </a>
        </th>
        <th>관리</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="comment : ${commentPage.content}">
        <td th:text="${comment.commentId}"></td>
        <td th:text="${comment.postId}"></td>
        <td>
            <strong th:text="${comment.authorName}"></strong><br>
            <small th:text="${comment.authorEmail}"></small>
        </td>
        <td th:text="${comment.content}"></td>
        <td th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${comment.reportCount}"></td>
        <td>
            <form th:action="@{/admin/comments/{id}/delete(id=${comment.commentId})}" method="post" onsubmit="return confirm('경고: 이 댓글을 영구적으로 삭제합니다. 되돌릴 수 없습니다. 정말 삭제하시겠습니까?');">
                <button type="submit">삭제</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<div class="pagination" th:if="${commentPage.totalPages > 1}">
    <a th:if="${commentPage.hasPrevious()}"
       th:href="@{/admin/comments(page=${commentPage.number - 1}, sort=${#strings.arrayJoin(commentPage.sort.toString().split(': '), ',')}, authorEmail=${searchRequest.authorEmail}, authorName=${searchRequest.authorName}, content=${searchRequest.content}, onlyReported=${searchRequest.onlyReported}, startDate=${searchRequest.startDate}, endDate=${searchRequest.endDate})}">이전</a>

    <span th:each="pageNumber : ${#numbers.sequence(0, commentPage.totalPages - 1)}">
        <a th:href="@{/admin/comments(page=${pageNumber}, sort=${#strings.arrayJoin(commentPage.sort.toString().split(': '), ',')}, authorEmail=${searchRequest.authorEmail}, authorName=${searchRequest.authorName}, content=${searchRequest.content}, onlyReported=${searchRequest.onlyReported}, startDate=${searchRequest.startDate}, endDate=${searchRequest.endDate})}"
           th:text="${pageNumber + 1}"
           th:classappend="${pageNumber == commentPage.number} ? 'active'"></a>
    </span>

    <a th:if="${commentPage.hasNext()}"
       th:href="@{/admin/comments(page=${commentPage.number + 1}, sort=${#strings.arrayJoin(commentPage.sort.toString().split(': '), ',')}, authorEmail=${searchRequest.authorEmail}, authorName=${searchRequest.authorName}, content=${searchRequest.content}, onlyReported=${searchRequest.onlyReported}, startDate=${searchRequest.startDate}, endDate=${searchRequest.endDate})}">다음</a>
</div>

</body>
</html>
