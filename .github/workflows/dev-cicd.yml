name: Deploy Foreigner (Dev via Docker Compose)

on:
  push:
    branches: [ dev ]

concurrency:
  group: deploy-foreigner-dev
  cancel-in-progress: true

jobs:
  # 0) 시크릿/환경 선확인만 담당
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          test -n "${{ secrets.DOCKERHUB_USERNAME }}" || (echo "DOCKERHUB_USERNAME is empty" && exit 1)
          test -n "${{ secrets.DOCKERHUB_TOKEN }}"     || (echo "DOCKERHUB_TOKEN is empty" && exit 1)
          test -n "${{ secrets.DEV_HOST }}"            || (echo "DEV_HOST is empty" && exit 1)
          test -n "${{ secrets.DEV_USER }}"            || (echo "DEV_USER is empty" && exit 1)
          test -n "${{ secrets.DEV_SSH_KEY }}"         || (echo "DEV_SSH_KEY is empty" && exit 1)
          test -n "${{ secrets.DB_NAME }}"             || (echo "DB_NAME is empty" && exit 1)
          test -n "${{ secrets.DB_USER }}"             || (echo "DB_USER is empty" && exit 1)
          test -n "${{ secrets.DB_PASSWORD }}"         || (echo "DB_PASSWORD is empty" && exit 1)
          test -n "${{ secrets.JWT_SECRET }}"          || (echo "JWT_SECRET is empty" && exit 1)
          test -n "${{ secrets.ES_URL }}"              || (echo "ES_URL is empty" && exit 1)
          test -n "${{ secrets.DEV_SUDO_PASSWORD }}" || (echo "DEV_SUDO_PASSWORD is empty" && exit 1)
          echo "All required secrets are set."

  # 1) 도커 이미지 빌드/푸시만 담당
  build:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.IMAGE }}
      sha: ${{ steps.meta.outputs.SHA }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: ⏱️ Start build timer
        id: build_t0
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foreigner:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/foreigner:${{ github.sha }}
          cache-from: |
            type=gha
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/foreigner:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/foreigner:buildcache,mode=max

      - name: Set meta
        id: meta
        run: |
          echo "IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/foreigner:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "SHA=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: 📦 Image size (compressed & uncompressed)
        id: img
        shell: bash
        run: |
          set -e
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/foreigner:${{ github.sha }}"

          # (1) 압축 크기(있으면)
          COMP=""
          if docker buildx imagetools inspect "$IMAGE" > inspect.txt 2>/dev/null; then
            COMP=$(grep -i -m1 'Size:' inspect.txt | awk '{print $2$3}' || true)
          fi
          echo "size=${COMP}" >> $GITHUB_OUTPUT

          # (2) 비압축 크기(항상 가능)
          docker pull -q "$IMAGE" >/dev/null
          BYTES=$(docker image inspect "$IMAGE" --format '{{.Size}}' || echo 0)
          MB=$(( BYTES/1024/1024 ))
          echo "size_uncompressed=${MB}MB" >> $GITHUB_OUTPUT

      - name: ✅ Build metrics
        id: build_sum
        run: |
          end=$(date +%s)
          echo "duration=$(( end - ${{ steps.build_t0.outputs.start }} ))" >> $GITHUB_OUTPUT

      - name: 📊 Build Summary
        run: |
          echo "## 🧱 Build Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---:|" >> $GITHUB_STEP_SUMMARY
          echo "| Duration | ${{ steps.build_sum.outputs.duration }} s |" >> $GITHUB_STEP_SUMMARY
          echo "| Image (compressed) | ${{ steps.img.outputs.size || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image (uncompressed) | ${{ steps.img.outputs.size_uncompressed }} |" >> $GITHUB_STEP_SUMMARY

  # 2) ES 템플릿/스크립트 업로드 (측정 없음)
  upload-es:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Upload ES assets (scripts + template)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          source: "infra/elasticsearch/**,infra/elasticsearch-events/**"
          target: "~/foreigner"

  # 3) ES 롤아웃만(템플릿→새 인덱스→(옵션)_reindex→별칭→검증)
  es-rollout:
    needs: upload-es
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Elasticsearch rollout on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            set -euo pipefail
            command -v curl >/dev/null || (echo "curl not found" && exit 1)
            
            export ES_URL="${{ secrets.ES_URL }}"
            export ES_AUTH="${{ secrets.ES_AUTH }}"
            : "${ES_URL:?ES_URL must be set}"
            
            CURL_AUTH=()
            if [ -n "${ES_AUTH:-}" ]; then
              CURL_AUTH=(-u "$ES_AUTH")
            fi

            # 연결 스모크(헤더만)
            echo "[ES] HEAD ${ES_URL}"
            curl -sS -I "${CURL_AUTH[@]}" "${ES_URL}" >/dev/null
            
            # [HOST] 안전 디스크 정리(도커 있으면): 이미지/빌더 캐시만 정리, 볼륨은 미삭제
            if command -v docker >/dev/null 2>&1; then
            docker system prune -af || true
            docker builder prune -af || true
            fi
            
            cd ~/foreigner
            chmod -R +x infra/elasticsearch/scripts || true
            
            
            echo "[ES] Apply template"
            ES_URL="$ES_URL" ES_AUTH="$ES_AUTH" \
            bash infra/elasticsearch/scripts/01-apply_template.sh

            echo "[ES] Create new index"
            ES_URL="$ES_URL" ES_AUTH="$ES_AUTH" ES_API_KEY="${{ secrets.ES_API_KEY }}" \
            HEALTH_TIMEOUT="180s" WAIT_FOR_STATUS="yellow" HEALTH_RETRIES=6 \
            bash infra/elasticsearch/scripts/02-create_index.sh
            
            NEW_IDX="$(cat infra/elasticsearch/.last_posts_index)"
            echo "[ES] New index = ${NEW_IDX}"

            SRC_ALIAS="posts_search"
            if ! curl -s -o /dev/null -w "%{http_code}\n" "${CURL_AUTH[@]}" "${ES_URL}/_alias/${SRC_ALIAS}" | grep -q '^20'; then
              SRC_ALIAS="posts_lab"
            fi
            echo "[ES] Reindex source alias = ${SRC_ALIAS}"

            curl -sS -X POST \
            -H 'Content-Type: application/json' "${CURL_AUTH[@]}" \
            "${ES_URL}/_reindex?wait_for_completion=true&refresh=true" \
            -d "{\"source\":{\"index\":\"${SRC_ALIAS}\"},\"dest\":{\"index\":\"${NEW_IDX}\"}}"
            
            
            echo "[ES] Switch aliases"
            ES_URL="$ES_URL" ES_AUTH="$ES_AUTH" \
            bash infra/elasticsearch/scripts/03-switch_alias.sh

            echo "[ES] Cleanup: keep last 1, delete the rest"
            ES_URL="$ES_URL" ES_AUTH="$ES_AUTH" \
            INDEX_PREFIX="posts-lab" KEEP_LAST=1 DRY_RUN=0 NEW_INDEX="$NEW_IDX" \
            bash infra/elasticsearch/scripts/04-cleanup_keep_last.sh

            echo "[ES] Verify"
            ES_URL="$ES_URL" ES_AUTH="$ES_AUTH" \
            bash infra/elasticsearch/scripts/99-verify.sh

            # --- events 롤아웃 ---
            echo "[ES(events)] Apply template"
            ES_URL="$ES_URL" ES_AUTH="$ES_AUTH" \
            bash infra/elasticsearch-events/scripts/events-01-apply_template.sh

            echo "[ES(events)] Create index"
            ES_URL="$ES_URL" ES_AUTH="$ES_AUTH" \
            INDEX_PREFIX="events-lab" HEALTH_TIMEOUT="120s" WAIT_FOR_STATUS="yellow" \
            bash infra/elasticsearch-events/scripts/events-02-create_index.sh

            echo "[ES(events)] Switch aliases"
            ES_URL="$ES_URL" ES_AUTH="$ES_AUTH" \
            ALIAS_SEARCH="events_read" ALIAS_WRITE="events_write" \
            bash infra/elasticsearch-events/scripts/events-03-switch_alias.sh

            echo "[ES(events)] Verify"
            ES_URL="$ES_URL" ES_AUTH="$ES_AUTH" \
            ALIAS_SEARCH="events_read" ALIAS_WRITE="events_write" \
            bash infra/elasticsearch-events/scripts/events-99-verify.sh


  # 4) 앱 배포만(.env 작성→docker compose pull/up)
  deploy-app:
    needs: [ build, es-rollout ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Note ES rollout result
        run: echo "ES rollout result = ${{ needs.es-rollout.result }}"

      - name: Deploy app on server (Docker Compose)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            set -euo pipefail
            command -v docker >/dev/null || (echo "docker not found" && exit 1)
            docker compose version || (echo "docker compose not found" && exit 1)

            mkdir -p ~/foreigner
            cd ~/foreigner

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            echo "${{ secrets.GCP_SA_KEY_JSON }}" | base64 --decode > gcp-key.json

            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/foreigner:${{ github.sha }}"
            : "${IMAGE:?IMAGE is empty}"
            echo "Using IMAGE=${IMAGE}"

            cat > .env <<'EOF'
            # --- PostgreSQL ---
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USERNAME=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            # --- Redis ---
            SPRING_DATA_REDIS_HOST=${{ secrets.REDIS_HOST }}
            SPRING_DATA_REDIS_PORT=${{ secrets.REDIS_PORT }}
            SPRING_DATA_REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

            # --- JWT ---
            JWT_SECRET=${{ secrets.JWT_SECRET }}

            # --- OAuth: Google ---
            ANDROID_CLIENT_ID=${{ secrets.ANDROID_CLIENT_ID }}
            ANDROID_REDIRECT_URI=${{ secrets.ANDROID_REDIRECT_URI }}
            IOS_CLIENT_ID=${{ secrets.IOS_CLIENT_ID }}
            IOS_REDIRECT_URI=${{ secrets.IOS_REDIRECT_URI }}
            WEB_CLIENT_ID=${{ secrets.WEB_CLIENT_ID }}
            WEB_CLIENT_SECRET=${{ secrets.WEB_CLIENT_SECRET }}
            WEB_REDIRECT_URI=${{ secrets.WEB_REDIRECT_URI }}

            # --- OAuth: Apple ---
            APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}
            APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}
            APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}
            APPLE_REDIRECT_URI=${{ secrets.APPLE_REDIRECT_URI }}
            APPLE_PRIVATE_KEY_PEM_PATH=./apple_key.pem
            APPLE_APP_BUNDLE_ID=${{ secrets.APPLE_APP_BUNDLE_ID }}

            # --- NCP Object Storage ---
            NCP_ACCESS_KEY=${{ secrets.NCP_ACCESS_KEY }}
            NCP_SECRET_KEY=${{ secrets.NCP_SECRET_KEY }}
            NCP_BUCKET_NAME=${{ secrets.NCP_BUCKET_NAME }}
            NCP_CDN_URL=${{ secrets.NCP_CDN_URL }}

            NCP_MAIL_HOST=${{ secrets.NCP_MAIL_HOST }}
            NCP_EMAIL=${{ secrets.NCP_EMAIL }}
            NCP_EMAIL_PASSWORD=${{ secrets.NCP_EMAIL_PASSWORD }}
            CLOVA_STUDIO_API_KEY=${{ secrets.CLOVA_STUDIO_API_KEY }}

            FEIGN_CONNECT_TIMEOUT=${{ secrets.FEIGN_CONNECT_TIMEOUT }}
            FEIGN_READ_TIMEOUT=${{ secrets.FEIGN_READ_TIMEOUT }}
            FEIGN_LOGGER_LEVEL=${{ secrets.FEIGN_LOGGER_LEVEL }}

            # --- Elasticsearch (app) ---
            ELASTICSEARCH_HOST=${{ secrets.ELASTICSEARCH_HOST }}
            
            FIREBASE_CREDENTIALS_JSON_PATH=./firebase.json

            SERVER_URL=${{ secrets.SERVER_URL }}

            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            GCP_TRANSLATE_API_KEY=${{ secrets.GCP_TRANSLATE_API_KEY }}

            NAVER_HOST=${{ secrets.NAVER_HOST }}
            APP_NAME=${{ secrets.APP_NAME }}
            BASE_URL=${{ secrets.BASE_URL }}

            # --- 추가 설정 ---
            SPRING_PROFILES_ACTIVE=dev
            JAVA_TOOL_OPTIONS="-Xms256m -Xmx512m"
            EOF
            
            cat > apple_key.pem <<'PEM'
            ${{ secrets.APPLE_PRIVATE_KEY_PEM }}
            PEM
            
            cat > firebase.json <<'JSON'
            ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
            JSON
            
            chmod 600 apple_key.pem firebase.json || true
            
            printf 'IMAGE=%s\n' "$IMAGE" >> .env
            chmod 600 .env || true
            
            SUDO_PASS='${{ secrets.DEV_SUDO_PASSWORD }}'
            if sudo -n true 2>/dev/null; then
            # NOPASSWD 이미 설정됨
            srun()   { sudo "$@"; }
            swrite() { sudo sh -c "printf '%s\n' \"$2\" > \"$1\""; }
            else
            # 비번 필요 → -S로 표준입력에서 비번 공급
            srun()   { printf '%s\n' "$SUDO_PASS" | sudo -S -p '' "$@"; }
            swrite() { printf '%s\n' "$SUDO_PASS" | sudo -S -p '' sh -c "printf '%s\n' \"$2\" > \"$1\""; }
            fi

            # 1) 활성 슬롯 파악 (없으면 blue로 초기화)
            ACTIVE_FILE=/etc/nginx/conf.d/foreigner-active
            if [ -f "$ACTIVE_FILE" ]; then
              ACTIVE_SLOT="$(cat "$ACTIVE_FILE")"
            else
              ACTIVE_SLOT="blue"
              swrite "$ACTIVE_FILE" "$ACTIVE_SLOT"
            fi

            if [ "$ACTIVE_SLOT" = "blue" ]; then
              NEXT_SLOT="green"
              NEXT_ENV=".env.green"
            else
              NEXT_SLOT="blue"
              NEXT_ENV=".env.blue"
            fi
            echo "ACTIVE_SLOT=$ACTIVE_SLOT, NEXT_SLOT=$NEXT_SLOT"
            
            BASE_COMPOSE="docker-compose.base.yml"
            BASE_PROJ="foreigner-base"
            BASE_NET="foreigner_net"
            
            ensure_network() {
             docker network inspect "$BASE_NET" >/dev/null 2>&1 || docker network create "$BASE_NET"
            }
            
            if [ -f "$BASE_COMPOSE" ]; then
              # base 스택이 이미 떠 있는지 판별(컨테이너 네이밍 프리픽스 기준)
              if docker ps --format '{{.Names}}' | grep -q "^${BASE_PROJ}-"; then
                echo "[base] stack is already running. skipping up -d"
                ensure_network
              else
                echo "[base] bringing up infra stack (first-time or not running)..."
                mkdir -p data/pgdata data/redis || true
                docker compose -p "$BASE_PROJ" -f "$BASE_COMPOSE" up -d --remove-orphans
                ensure_network
              fi
            else
              echo "[base] $BASE_COMPOSE not found (skip base stack)."
              ensure_network
            fi

            # NEXT 슬롯용 env 파일 보장
            [ -f "$NEXT_ENV" ] || touch "$NEXT_ENV"
            
            
            # 2) 새 슬롯에 이미지 배포 (앱 전용 compose)
            COMPOSE_APP="docker-compose.app.yml"
            test -f "$COMPOSE_APP" || { echo "missing $COMPOSE_APP on server"; exit 1; }

            docker compose -p "foreigner-${NEXT_SLOT}" -f "$COMPOSE_APP" \
              --env-file .env --env-file "$NEXT_ENV" pull

            docker compose -p "foreigner-${NEXT_SLOT}" -f "$COMPOSE_APP" \
              --env-file .env --env-file "$NEXT_ENV" up -d --remove-orphans

            # 3) 헬스체크 대기
            echo "Waiting for health on ${NEXT_SLOT}..."
            ATTEMPTS=24; SLEEP=5; ok=0
            for i in $(seq 1 $ATTEMPTS); do
              if docker compose -p "foreigner-${NEXT_SLOT}" ps | grep -qi "healthy"; then
                ok=1; break
              fi
              sleep $SLEEP
            done

            if [ "$ok" -ne 1 ]; then
              APP_PORT="$(grep -E '^APP_PORT=' "$NEXT_ENV" | cut -d= -f2)"
              if command -v curl >/dev/null 2>&1 && [ -n "${APP_PORT:-}" ]; then
                for i in $(seq 1 $ATTEMPTS); do
                  if curl -fsS "http://127.0.0.1:${APP_PORT}/actuator/health" | grep -q '"status":"UP"'; then
                    ok=1; break
                  fi
                  sleep $SLEEP
                done
              fi
            fi

            if [ "$ok" -ne 1 ]; then
              echo "New slot failed to become healthy. Recent logs:"
              docker compose -p "foreigner-${NEXT_SLOT}" logs --since=10m || true
              exit 1
            fi

            # 4) Nginx 업스트림 전환
            if [ "$NEXT_SLOT" = "blue" ]; then
              srun ln -sf /etc/nginx/conf.d/foreigner-blue.conf  /etc/nginx/conf.d/foreigner-upstream.conf
            else
              srun ln -sf /etc/nginx/conf.d/foreigner-green.conf /etc/nginx/conf.d/foreigner-upstream.conf
            fi
            swrite "$ACTIVE_FILE" "$NEXT_SLOT"
            srun nginx -t
            srun nginx -s reload

            # 5) 이전 슬롯 종료 및 정리
            if [ "$ACTIVE_SLOT" != "$NEXT_SLOT" ]; then
              docker compose -p "foreigner-${ACTIVE_SLOT}" -f "$COMPOSE_APP" down || true
            fi

            docker image prune -f || true
            docker compose -p "foreigner-${NEXT_SLOT}" -f "$COMPOSE_APP" ps