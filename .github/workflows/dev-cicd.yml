name: Deploy Foreigner (Dev via Docker Compose)

on:
  push:
    branches: [ dev ]

concurrency:
  group: deploy-foreigner-dev
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          test -n "${{ secrets.DOCKERHUB_USERNAME }}" || (echo "DOCKERHUB_USERNAME is empty" && exit 1)
          test -n "${{ secrets.DOCKERHUB_TOKEN }}"     || (echo "DOCKERHUB_TOKEN is empty" && exit 1)
          test -n "${{ secrets.DEV_HOST }}"            || (echo "DEV_HOST is empty" && exit 1)
          test -n "${{ secrets.DEV_USER }}"            || (echo "DEV_USER is empty" && exit 1)
          test -n "${{ secrets.DEV_SSH_KEY }}"         || (echo "DEV_SSH_KEY is empty" && exit 1)
          test -n "${{ secrets.DB_NAME }}"             || (echo "DB_NAME is empty" && exit 1)
          test -n "${{ secrets.DB_USER }}"             || (echo "DB_USER is empty" && exit 1)
          test -n "${{ secrets.DB_PASSWORD }}"         || (echo "DB_PASSWORD is empty" && exit 1)
          test -n "${{ secrets.JWT_SECRET }}"          || (echo "JWT_SECRET is empty" && exit 1)
          test -n "${{ secrets.ES_URL }}"              || (echo "ES_URL is empty" && exit 1)
          test -n "${{ secrets.DEV_SUDO_PASSWORD }}"   || (echo "DEV_SUDO_PASSWORD is empty" && exit 1)
          echo "All required secrets are set."

  build:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foreigner:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/foreigner:${{ github.sha }}
          cache-from: |
            type=gha
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/foreigner:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/foreigner:buildcache,mode=max

  upload-es:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload ES assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          source: "infra/elasticsearch/**,infra/elasticsearch-events/**"
          target: "~/foreigner"

  es-rollout:
    needs: upload-es
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Elasticsearch rollout
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            set -euo pipefail
            command -v curl >/dev/null || (echo "curl not found" && exit 1)

            export ES_URL="${{ secrets.ES_URL }}"
            export ES_AUTH="${{ secrets.ES_AUTH }}"
            : "${ES_URL:?ES_URL must be set}"

            CURL_AUTH=()
            if [ -n "${ES_AUTH:-}" ]; then CURL_AUTH=(-u "$ES_AUTH"); fi

            echo "[ES] HEAD ${ES_URL}"
            curl -sS -I "${CURL_AUTH[@]}" "${ES_URL}" >/dev/null

            # (옵션) 호스트 도커 캐시 정리
            if command -v docker >/dev/null 2>&1; then
              docker system prune -af || true
              docker builder prune -af || true
            fi

            cd ~/foreigner
            chmod -R +x infra/elasticsearch/scripts || true

            echo "[ES] Apply template"
            ES_URL="$ES_URL" ES_AUTH="$ES_AUTH" \
            bash infra/elasticsearch/scripts/01-apply_template.sh

            echo "[ES] Create new index"
            ES_URL="$ES_URL" ES_AUTH="$ES_AUTH" ES_API_KEY="${{ secrets.ES_API_KEY }}" \
            HEALTH_TIMEOUT="180s" WAIT_FOR_STATUS="yellow" HEALTH_RETRIES=6 \
            bash infra/elasticsearch/scripts/02-create_index.sh

            NEW_IDX="$(cat infra/elasticsearch/.last_posts_index)"
            echo "[ES] New index = ${NEW_IDX}"

            SRC_ALIAS="posts_search"
            if ! curl -s -o /dev/null -w "%{http_code}\n" "${CURL_AUTH[@]}" "${ES_URL}/_alias/${SRC_ALIAS}" | grep -q '^20'; then
              SRC_ALIAS="posts_lab"
            fi
            echo "[ES] Reindex from ${SRC_ALIAS}"
            curl -sS -X POST -H 'Content-Type: application/json' "${CURL_AUTH[@]}" \
              "${ES_URL}/_reindex?wait_for_completion=true&refresh=true" \
              -d "{\"source\":{\"index\":\"${SRC_ALIAS}\"},\"dest\":{\"index\":\"${NEW_IDX}\"}}"

            echo "[ES] Switch aliases"
            ES_URL="$ES_URL" ES_AUTH="$ES_AUTH" \
            bash infra/elasticsearch/scripts/03-switch_alias.sh

            echo "[ES] Cleanup old indices"
            ES_URL="$ES_URL" ES_AUTH="$ES_AUTH" \
            INDEX_PREFIX="posts-lab" KEEP_LAST=1 DRY_RUN=0 NEW_INDEX="$NEW_IDX" \
            bash infra/elasticsearch/scripts/04-cleanup_keep_last.sh

            echo "[ES] Verify"
            ES_URL="$ES_URL" ES_AUTH="$ES_AUTH" \
            bash infra/elasticsearch/scripts/99-verify.sh

            echo "[events] Apply/rollout"
            ES_URL="$ES_URL" ES_AUTH="$ES_AUTH" \
            bash infra/elasticsearch-events/scripts/events-01-apply_template.sh
            ES_URL="$ES_URL" ES_AUTH="$ES_AUTH" \
            INDEX_PREFIX="events-lab" HEALTH_TIMEOUT="120s" WAIT_FOR_STATUS="yellow" \
            bash infra/elasticsearch-events/scripts/events-02-create_index.sh
            ES_URL="$ES_URL" ES_AUTH="$ES_AUTH" \
            ALIAS_SEARCH="events_read" ALIAS_WRITE="events_write" \
            bash infra/elasticsearch-events/scripts/events-03-switch_alias.sh
            ES_URL="$ES_URL" ES_AUTH="$ES_AUTH" \
            ALIAS_SEARCH="events_read" ALIAS_WRITE="events_write" \
            bash infra/elasticsearch-events/scripts/events-99-verify.sh

  deploy-app:
    needs: [ build, es-rollout ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Note ES rollout result
        run: echo "ES rollout result = ${{ needs.es-rollout.result }}"

      - name: Deploy (Docker Compose, blue/green via gateway)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            set -euo pipefail
            command -v docker >/dev/null || (echo "docker not found" && exit 1)
            docker compose version || (echo "docker compose not found" && exit 1)
            
            mkdir -p ~/foreigner
            cd ~/foreigner
            
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            echo "${{ secrets.GCP_SA_KEY_JSON }}" | base64 --decode > gcp-key.json
            
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/foreigner:${{ github.sha }}"
            : "${IMAGE:?IMAGE is empty}"
            echo "Using IMAGE=${IMAGE}"
            
            # 공통 .env
            cat > .env <<'EOF'
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USERNAME=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            
            SPRING_DATA_REDIS_HOST=${{ secrets.REDIS_HOST }}
            SPRING_DATA_REDIS_PORT=${{ secrets.REDIS_PORT }}
            SPRING_DATA_REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            
            ANDROID_CLIENT_ID=${{ secrets.ANDROID_CLIENT_ID }}
            ANDROID_REDIRECT_URI=${{ secrets.ANDROID_REDIRECT_URI }}
            IOS_CLIENT_ID=${{ secrets.IOS_CLIENT_ID }}
            IOS_REDIRECT_URI=${{ secrets.IOS_REDIRECT_URI }}
            WEB_CLIENT_ID=${{ secrets.WEB_CLIENT_ID }}
            WEB_CLIENT_SECRET=${{ secrets.WEB_CLIENT_SECRET }}
            WEB_REDIRECT_URI=${{ secrets.WEB_REDIRECT_URI }}
            
            APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}
            APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}
            APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}
            APPLE_REDIRECT_URI=${{ secrets.APPLE_REDIRECT_URI }}
            APPLE_PRIVATE_KEY_PEM_PATH=./apple_key.pem
            APPLE_APP_BUNDLE_ID=${{ secrets.APPLE_APP_BUNDLE_ID }}
            
            NCP_ACCESS_KEY=${{ secrets.NCP_ACCESS_KEY }}
            NCP_SECRET_KEY=${{ secrets.NCP_SECRET_KEY }}
            NCP_BUCKET_NAME=${{ secrets.NCP_BUCKET_NAME }}
            NCP_CDN_URL=${{ secrets.NCP_CDN_URL }}
            
            NCP_MAIL_HOST=${{ secrets.NCP_MAIL_HOST }}
            NCP_EMAIL=${{ secrets.NCP_EMAIL }}
            NCP_EMAIL_PASSWORD=${{ secrets.NCP_EMAIL_PASSWORD }}
            CLOVA_STUDIO_API_KEY=${{ secrets.CLOVA_STUDIO_API_KEY }}
            
            FEIGN_CONNECT_TIMEOUT=${{ secrets.FEIGN_CONNECT_TIMEOUT }}
            FEIGN_READ_TIMEOUT=${{ secrets.FEIGN_READ_TIMEOUT }}
            FEIGN_LOGGER_LEVEL=${{ secrets.FEIGN_LOGGER_LEVEL }}
            
            ELASTICSEARCH_HOST=${{ secrets.ELASTICSEARCH_HOST }}
            FIREBASE_CREDENTIALS_JSON_PATH=./firebase.json
            SERVER_URL=${{ secrets.SERVER_URL }}
            
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            GCP_TRANSLATE_API_KEY=${{ secrets.GCP_TRANSLATE_API_KEY }}
            
            NAVER_HOST=${{ secrets.NAVER_HOST }}
            APP_NAME=${{ secrets.APP_NAME }}
            BASE_URL=${{ secrets.BASE_URL }}
            
            SPRING_PROFILES_ACTIVE=dev
            JAVA_TOOL_OPTIONS="-Xms256m -Xmx512m"
            EOF
            
            cat > apple_key.pem <<'PEM'
            ${{ secrets.APPLE_PRIVATE_KEY_PEM }}
            PEM
            
            cat > firebase.json <<'JSON'
            ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
            JSON
            
            # 이미지 변수는 .env에 한 번만 기록
            {
              echo "IMAGE=${IMAGE}"
              echo "IMAGE_BLUE=${IMAGE}"
              echo "IMAGE_GREEN=${IMAGE}"
            } >> .env
            
            chmod 600 .env apple_key.pem firebase.json || true
            
            # compose/네트워크 확인
            COMPOSE_APP="docker-compose.app.yml"
            test -f "$COMPOSE_APP" || { echo "missing $COMPOSE_APP"; exit 1; }
            docker network inspect foreigner_net >/dev/null 2>&1 || docker network create foreigner_net
            
            # gateway부터(호스트 8080 바인딩)
            docker compose -p foreigner -f "$COMPOSE_APP" up -d gateway
            
            # 활성 슬롯 기록 파일 (프로젝트 내부)
            ACTIVE_FILE="nginx/conf.d/.active"
            if [ -f "$ACTIVE_FILE" ]; then
              ACTIVE_SLOT="$(cat "$ACTIVE_FILE")"
            else
              ACTIVE_SLOT="blue"
              echo "$ACTIVE_SLOT" > "$ACTIVE_FILE"
            fi
            if [ "$ACTIVE_SLOT" = "blue" ]; then NEXT_SLOT="green"; else NEXT_SLOT="blue"; fi
            echo "ACTIVE_SLOT=$ACTIVE_SLOT, NEXT_SLOT=$NEXT_SLOT"
            
            # 다음 슬롯만 pull/up (IMAGE_*는 .env에서 주입)
            docker compose -p foreigner -f "$COMPOSE_APP" pull "app-${NEXT_SLOT}" || true
            docker compose -p foreigner -f "$COMPOSE_APP" up -d --no-deps "app-${NEXT_SLOT}"
            
            # 내부 헬스체크
            ATTEMPTS=30; SLEEP=3; ok=0
            for i in $(seq 1 $ATTEMPTS); do
              if docker run --rm --network foreigner_net curlimages/curl -fsS \
                   "http://app-${NEXT_SLOT}:8080/actuator/health" | grep -q '"status":"UP"'; then
                ok=1; break
              fi
              sleep $SLEEP
            done
            [ "$ok" -eq 1 ] || { echo "health check failed for app-${NEXT_SLOT}"; docker compose -p foreigner -f "$COMPOSE_APP" logs "app-${NEXT_SLOT}" --since=10m || true; exit 1; }
            
            # upstream 전환 → gateway reload (목표 상태 보장 교체)
            if [ "$NEXT_SLOT" = "blue" ]; then
              sed -i -e 's/server app-green:8080;/server app-blue:8080;/g' \
                     -e 's/server app-blue:8080;/server app-blue:8080;/g' nginx/conf.d/default.conf
            else
              sed -i -e 's/server app-blue:8080;/server app-green:8080;/g' \
                     -e 's/server app-green:8080;/server app-green:8080;/g' nginx/conf.d/default.conf
            fi
            GW_ID="$(docker compose -p foreigner -f "$COMPOSE_APP" ps -q gateway)"
            docker exec "$GW_ID" nginx -t
            docker exec "$GW_ID" nginx -s reload
            
            echo "$NEXT_SLOT" > "$ACTIVE_FILE"
            
            # 이전 슬롯 정리(선택)
            if [ "$ACTIVE_SLOT" != "$NEXT_SLOT" ]; then
              docker compose -p foreigner -f "$COMPOSE_APP" rm -f "app-${ACTIVE_SLOT}" || true
            fi
            
            docker image prune -f || true
            docker compose -p foreigner -f "$COMPOSE_APP" ps
            echo "✅ switched to ${NEXT_SLOT}"